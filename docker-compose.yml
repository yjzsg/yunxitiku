services:
  yunxi-tiku:
    image: ghcr.io/yjzsg/yunxitiku:latest
    container_name: yunxi-tiku
    ports:
      # 默认只绑回环：本机的反向代理/隧道能连，局域网和公网连不上。
      #
      # 要让局域网设备（手机/平板/其它电脑）用 http://NAS_IP:8787 访问，任选一种：
      #   ① 直接写本机 LAN IP（改这一行）：
      #        - "192.168.1.10:8787:8787"
      #   ② 或建一个 `.env`（已 gitignore，不进仓库）写：
      #        YUNXI_BIND_ADDR=0.0.0.0
      #      下面这行会把变量读进来；没配 `.env` 时回落环。
      #
      # ⚠️ 不要在 `docker-compose.override.yml` 里加 `ports:` 来放宽 ——
      #    compose 对 ports 是**追加**不是替换，会和这一行形成「同一个容器端口发布两次」
      #    的冲突，容器起来就退（实测：状态停在 Created、无日志、端口 000）。
      #
      # 直连就是明文 HTTP（这里没有 TLS），只在可信网段这么做。
      - "${YUNXI_BIND_ADDR:-127.0.0.1}:8787:8787"
    volumes:
      - ./data:/app/data
      - ./userdata:/app/userdata
    environment:
      App__SqlitePath: /app/data/question-bank.db
      App__DataAssetsRoot: /app/data/assets
      App__UserDataRoot: /app/userdata
      # 容器时区。不设时容器是 UTC，落盘时间戳（savedAt / changedAt / 备份目录名）会比本地早 8 小时。
      TZ: Asia/Shanghai
      # 初始登录口令：新建账号的初始密码，也是管理端「重置密码」的目标值。
      # ⚠️ 不在这里写公开默认值（旧版是 "123456"）：写了等于任何人只要连得上，
      #    就能抢先用它完成首次接管——「首次登录强制改密」只能约束改了密之后，管不了谁先登录。
      # 不配置 App__DefaultLoginPassword 时服务启动会随机生成一次性口令（每次启动重新生成），
      # 写到 ./userdata/admin-init-password.txt，用完请删除；重启会换新口令。
      # 确实需要固定口令（自动化测试等）：写进 docker-compose.override.yml（已 gitignore，override 优先）。
      # App__DefaultLoginPassword: "<你自己的口令>"
      # 上游题库服务账号不在这个文件里（机密，不进仓库）：
      # 本机部署时写进 docker-compose.override.yml（见 docker-compose.override.yml.example），
      # 或用环境变量 App__BankServiceUser / App__BankServicePassword 传入。
      # 不配置时「拉取更新 / 检查可更新」会返回明确的配置缺失错误。
      #
      # 反向代理/隧道部署（默认绑 127.0.0.1 就是这种用法）：
      # 应用默认**只信任回环来源**的 X-Forwarded-For / X-Forwarded-Proto，
      # 所以反代在另一个容器或另一台机器上时，要把它的地址写进来（逗号分隔 IP 或 CIDR），
      # 否则登录限流会把所有来访者当成同一个 IP（20 次/分钟），真实 IP 也不再生效。
      # Docker 里宿主机/其它容器过来的连接一般显示为网桥网关，用 `docker exec yunxi-tiku ip route` 查默认网关。
      # App__TrustedProxies: "172.17.0.1"
    healthcheck:
      test: ["CMD-SHELL", "DOTNET_CLI_TELEMETRY_OPTOUT=1 dotnet exec /app/YunxiTiku.Web.dll --healthcheck http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
